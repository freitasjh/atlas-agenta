# Configuração do projeto Supabase local do Atlas Agenda (CLI).
#
# Arquivo versionado. NÃO contém segredos — só configuração pública do projeto local.
# Service role key, chave do Asaas e token da Evolution vivem em variáveis de ambiente /
# secrets do Supabase (Edge Functions), nunca aqui.
#
# Nota de ambiente: este repo foi inicializado SEM a Supabase CLI instalada, então este
# config.toml foi escrito à mão no formato padrão do `supabase init`. Ao rodar `supabase init`
# localmente num ambiente com a CLI, o arquivo pode ser regenerado/ajustado sem perda.

# A string que identifica o projeto. Default: nome do diretório de trabalho ao rodar
# `supabase init`.
project_id = "atlas-agenda"

[api]
enabled = true
# Porta usada pela API REST do PostgREST local.
port = 54321
# Schemas expostos na API. `public` e `graphql_public`. Nunca expor schemas internos.
schemas = ["public", "graphql_public"]
# Schemas adicionais no search_path das requisições.
extra_search_path = ["public", "extensions"]
# Máximo de linhas retornadas de uma view, tabela ou função. Limita o tamanho da resposta.
max_rows = 1000

[db]
# Porta do banco Postgres local.
port = 54322
# Porta usada por `db diff` com um banco shadow.
shadow_port = 54320
# Versão principal do Postgres. Deve casar com a do projeto remoto.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captura de e-mails em desenvolvimento (Inbucket): e-mails de auth não saem de verdade,
# ficam retidos para inspeção local.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Tamanho máximo de upload de arquivo.
file_size_limit = "50MiB"

[auth]
enabled = true
# URL base da app. Redirect padrão quando `redirectTo` não é informado no código.
# Vite serve o frontend em 5173 por padrão neste projeto.
site_url = "http://localhost:5173"
# Lista de URLs *exatas* permitidas como destino de redirect pós-autenticação.
# Inclui a rota de redefinição de senha (fluxo "recuperar senha" -> link do e-mail).
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/redefinir-senha",
]
# Tempo de vida do JWT em segundos (1 hora).
jwt_expiry = 3600
# Permite emitir/trocar refresh tokens que ainda não expiraram.
enable_refresh_token_rotation = true
# Janela em segundos para reutilizar um refresh token após a rotação.
refresh_token_reuse_interval = 10
# Permite que novos usuários se cadastrem.
enable_signup = true

[auth.email]
# Permite login/cadastro por e-mail + senha.
enable_signup = true
# Permite trocar o e-mail sem reconfirmar (duplo-opt-in desligado).
double_confirm_changes = true
# Q2 (decisão de produto, MVP): confirmação de e-mail DESLIGADA. O cadastro já abre sessão
# e cai em /app, sem tela de "verifique seu e-mail". O código do frontend permanece tolerante
# caso esta config seja religada no futuro.
enable_confirmations = false

# Hook de claims do access token (ADR-01): a Edge Function `custom-access-token` adiciona
# `user_role`, `tenant_id` e `must_change_password` ao JWT. Não emite `role` (papel Postgres).
# A URI é a da função servida pelo stack local: o GoTrue roda em container e alcança o host por
# `host.docker.internal`. Em hosted, troque pela URL da função do projeto.
# `secrets` aponta para a mesma variável que a função lê (`CUSTOM_ACCESS_TOKEN_HOOK_SECRET`), usada
# para o GoTrue assinar a chamada. O valor vem do ambiente local e nunca é escrito aqui.
[auth.hook.custom_access_token]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/custom-access-token"
secrets = "env(CUSTOM_ACCESS_TOKEN_HOOK_SECRET)"

[auth.sms]
enable_signup = false
enable_confirmations = false

# Provedores externos de OAuth ficam desligados no MVP.
[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
# Política de inspeção para depuração de Edge Functions.
inspector_port = 8083

# Hook de claims (ADR-01): chamada pelo GoTrue, não por um usuário. Não tem JWT de usuário. A
# autenticidade é a assinatura Standard Webhooks do hook, validada dentro da função.
[functions.custom-access-token]
verify_jwt = false

# Cadastro de empresa (ADR-02, RQ-19): superfície PÚBLICA, porque é o próprio cadastro e quem chama
# ainda não tem sessão. A função valida o corpo com zod (`.strict()`) e cria a empresa pela RPC
# `create_tenant_with_admin`, com service role no servidor. Não há `verify_jwt` de usuário aqui.
[functions.signup-tenant]
verify_jwt = false

# Webhook de ENTRADA da Evolution (ADR-03, Fatia 2): superfície PÚBLICA, sem JWT de usuário. A
# autenticidade é feita pelo segredo compartilhado `WHATSAPP_WEBHOOK_SECRET` (comparação em tempo
# constante dentro da função), não pelo GoTrue — por isso `verify_jwt = false` SÓ para esta
# função. As demais Edge Functions (ex.: `whatsapp`) continuam exigindo JWT (default verify_jwt).
[functions.whatsapp-inbound]
verify_jwt = false

# Bootstrap do super admin inicial (ADR-05): superfície PÚBLICA, porque o operador a chama sem
# sessão. A autenticidade é o segredo `BOOTSTRAP_SECRET` no header `x-bootstrap-secret`, comparado
# em tempo constante DENTRO da função — não pelo GoTrue. Sem o segredo no ambiente, a função
# responde 404 (parece não existir); segredo errado, 401. A trava `ATLAS_ENV=local` recusa execução
# fora do ambiente local com 403, mesmo com o segredo certo. Nunca deixar `verify_jwt = true` aqui:
# a função não tem usuário para autenticar.
[functions.bootstrap-super-admin]
verify_jwt = false

# Drenadora da fila de retentativa (ADR-05, Fatia 2): worker INTERNO do sistema. Mantém o
# verify_jwt DEFAULT (true) de propósito — não é superfície pública. É invocada pelo cron
# `atlas_retry_queue` (no hosted, via pg_net com a service role key, que o GoTrue aceita como
# bearer) ou manualmente pelo QA com um JWT válido. Não resolve identidade de usuário; usa service
# role internamente. Nenhuma entrada [functions.whatsapp-dispatch] com verify_jwt=false — deixar o
# default fecha a função a chamadas anônimas.

# Webhooks Asaas (ADR-20): superfícies PÚBLICAS, sem JWT; autenticidade por token
# compartilhado no header `asaas-access-token`, comparado em tempo constante dentro da função.
[functions.asaas-webhook]
verify_jwt = false

[functions.asaas-subscription-webhook]
verify_jwt = false
